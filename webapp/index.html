<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashFlip — Interactive Flash Cards</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B4%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-blob blob-a" aria-hidden="true"></div>
<div class="bg-blob blob-b" aria-hidden="true"></div>
<div class="bg-blob blob-c" aria-hidden="true"></div>

<div class="app">
  <header class="app-header">
    <h1>🎴 FlashFlip</h1>
    <p class="tagline">Click. Flip. Learn.</p>
  </header>

  <!-- SCREEN 1: choose a deck -->
  <section id="screen-load" class="screen">
    <div class="panel">
      <h2>Choose a deck</h2>
      <p class="hint-text">Pick a flashcard CSV to begin — try one of the built-in decks, or load your own CSV (front, reading, and optionally meaning &amp; example).</p>

      <div class="quick-decks">
        <button type="button" class="deck-btn" data-path="../data/hiragana.csv">あ Hiragana</button>
        <button type="button" class="deck-btn" data-path="../data/katakana.csv">ア Katakana</button>
        <button type="button" class="deck-btn" data-path="../data/verb.csv">動 Verbs</button>
      </div>

      <label class="file-picker" for="csvInput" id="fileLabel">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14"/></svg>
        <span id="fileLabelText">…or choose a CSV file</span>
      </label>
      <input type="file" id="csvInput" accept=".csv" hidden>

      <p id="loadError" class="error-text" hidden></p>

      <button id="startBtn" class="btn btn-primary" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z"/></svg>
        Start
        <kbd>Enter</kbd>
      </button>
    </div>
  </section>

  <!-- SCREEN 2: play -->
  <section id="screen-play" class="screen" hidden>
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="deckName"></span>
        <span id="progressCount"></span>
      </div>
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
    </div>

    <div class="card-stage">
      <div class="card" id="card" tabindex="0" role="button" aria-label="Flip card">
        <div class="card-face card-front">
          <span class="face-label" id="frontLabel">Front</span>
          <span class="face-text" id="frontText"></span>
          <span class="face-hint">tap to flip</span>
        </div>
        <div class="card-face card-back" id="cardBack">
          <span class="face-label" id="backLabel">Back</span>
          <span class="face-text" id="backText"></span>
          <span class="face-meaning" id="backMeaning" hidden></span>
          <span class="face-example" id="backExample" hidden></span>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="flipBtn" class="btn btn-primary">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h11a5 5 0 0 1 5 5v1"/><path d="M16 21l4-4-4-4"/><path d="M20 17H9a5 5 0 0 1-5-5v-1"/></svg>
        Flip Card
        <kbd>Space</kbd>
      </button>
      <button id="finishBtn" class="btn btn-danger">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h13l-3 4 3 4H5"/></svg>
        Finish
        <kbd>Esc</kbd>
      </button>
    </div>
  </section>

  <!-- SCREEN 3: complete -->
  <section id="screen-complete" class="screen" hidden>
    <div class="panel panel-complete">
      <div class="complete-emoji" id="completeEmoji">🎉</div>
      <h2 id="completeTitle">Nice work!</h2>
      <p id="completeSubtitle" class="hint-text"></p>
      <div class="controls">
        <button id="retryBtn" class="btn btn-primary">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h11a5 5 0 0 1 5 5v1"/><path d="M16 21l4-4-4-4"/><path d="M20 17H9a5 5 0 0 1-5-5v-1"/></svg>
          Retry
          <kbd>R</kbd>
        </button>
        <button id="exitBtn" class="btn btn-danger">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Exit
          <kbd>Esc</kbd>
        </button>
      </div>
      <p id="exitNote" class="hint-text small" hidden>You can close this tab now.</p>
    </div>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
